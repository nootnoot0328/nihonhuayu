<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff4e9"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="日本華語">
<meta name="description" content="把中文變成可愛的假日文，一鍵複製，聊天更有梗！">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./logo.webp" type="image/webp"><link rel="apple-touch-icon" href="./logo.webp">
<link rel="stylesheet" href="./style.css"><script src="./app.js" defer></script>
<title>日本華語 · Nihon Huayu</title></head>
<body><div class="shell">
<header class="top"><a class="logo" href="./"><img class="logo-image" src="./logo.webp" alt="" width="41" height="41"><span>日本華語<small>NIHON HUAYU</small></span></a><span class="version">✿ v1.0</span></header>
<main>
<div class="hero"><p class="eyebrow">中文聊天 · 日文靈魂</p><div class="hero-art"><img class="mascot-illustration" src="./logo.webp?v=2" alt="可愛的橘白貓抱著中日文轉換卡片" width="200" height="200"><div class="bubble">にほんご…かな？ ✨</div></div><h1>講中文，<em>裝日文。</em></h1><p class="subtitle">把普通聊天變成可愛又荒謬的假日文 ♡</p></div>
<section class="workspace" aria-label="文字轉換">
<div class="direction"><button class="lang active" id="fromLang">中文</button><button class="swap" id="swap" aria-label="切換轉換方向" title="切換方向">⇄</button><button class="lang" id="toLang">假日文</button></div>
<div class="fieldtop"><label for="source">✎ 你想說什麼？</label><button class="subtle" id="clear">清空 ×</button></div>
<textarea id="source" maxlength="280" placeholder="例如：什麼樣的便當？" rows="4" spellcheck="false"></textarea>
<div class="controls"><span id="counter">0 / 280</span><span id="hint">越短越有梗！</span></div>
<div class="modebar"><span>STYLE</span><div class="modes" role="group" aria-label="轉換風格"><button data-mode="mixed" class="selected">🍡 混搭</button><button data-mode="hira">あ 平假名</button><button data-mode="kata">ア 片假名</button></div></div>
<button id="convert" class="convert">✨ 變身！<span class="arrow">↗</span></button>
<div class="result"><div class="resulthead"><span>✦ CONVERTED MAGIC</span><span id="resultBadge">等待施法中…</span></div><p id="output" class="output" aria-live="polite">ここに出るよ ♡</p><p id="note" class="note">輸入一句中文試試看！</p><div class="resultactions"><button id="copy" class="copy">⧉ 複製結果</button><button id="share" class="share">↗ 分享</button></div></div>
</section>
<section class="samples"><div class="sectiontitle"><h2>🍮 不知道說什麼？</h2><span>點一下試試</span></div><div class="chips"><button data-example="什麼樣的便當？">什麼樣的便當？</button><button data-example="好吃的嗎？">好吃的嗎？</button><button data-example="你在幹嘛？">你在幹嘛？</button><button data-example="真的假的？">真的假的？</button><button data-example="我不知道耶">我不知道耶</button><button data-example="我要睡覺了">我要睡覺了</button></div></section>
</main><footer>Made for silly conversations ☁️ <span>·</span> No account, no uploads</footer></div>
<div id="toast" role="status" aria-live="polite"></div>
</body></html>
